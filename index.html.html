<p style='text-align:center;margin:34px 0 10px'><button data-a='ean' class='${an?'on':''}'>📊 Аналитика ${an?'▲':'▼'}</button></p><div id='an'></div>`;if(an)aview()}

m.innerHTML=`<div class='emb' data-a='ecl'></div><div class='emc card wh'><span class='lb'>Редактировать расход</span><label class='f'>Название<input id='e_t' value='${E(e.title)}'></label><div class='fg' style='grid-template-columns:1fr 1fr'><label class='f'>Сумма<input id='e_a' type='number' step='any' inputmode='decimal' value='${e.amount}'></label><label class='f'>Валюта<select id='e_c'>${opt(cs,e.cur)}</select></label><label class='f'>Категория<select id='e_k'>${opt(ECAT,e.cat)}</select></label><label class='f'>Оплата<select id='e_p'>${opt(['Наличные','Карта','Онлайн'],e.pay)}</select></label><label class='f'>Дата<input id='e_d' type='date' value='${E(e.date||'')}'></label><label class='f'>Время<input id='e_h' type='time' value='${E(e.time||'')}'></label></div><button class='pr big2' data-a='esv2' data-id='${e.id}'>Сохранить</button> <button class='big2' style='margin-top:8px' data-a='ecl'>Отмена</button></div>`;m.className='o'}
Object.assign(A,{pdfgo,txt(){navigator.clipboard?.writeText(rtext()).then(()=>toast('Отчёт скопирован'),()=>toast('Нет доступа к буферу'))},eed:d=>emodal(d.id),ecl(){const m=$('#em');if(m)m.className=''},esv2(d){const e=S.exp.find(x=>x.id==d.id),n=+$('#e_a').value;if(!e)return;if(!(n>0))return toast('Сумма должна быть больше 0');Object.assign(e,{title:$('#e_t').value.trim()||$('#e_k').value,amount:n,cur:$('#e_c').value,cat:$('#e_k').value,pay:$('#e_p').value,date:$('#e_d').value,time:$('#e_h').value});if(e.date)ed=e.date;save();A.ecl();eview();toast('Расход обновлён ✓')},ean(){an=!an;eview()},eday:d=>{ed=d.v;eview()},cuse(d){const f=$('#ef'),a=+$('#ca').value,fr=$('#cf').value;if(!a)return toast('Введите сумму');f.amount.value=+(a/fx(fr)*fx(d.v)).toFixed(2);f.cur.value=d.v;xsync();A.eopen()},xcat:d=>{$('#ef').cat.value=d.v;xsync()},xpay:d=>{$('#ef').pay.value=d.v;xsync()},xcur:d=>{$('#ef').cur.value=d.v;xsync()},xday:d=>{$('#ef').date.value=today(+d.v);xsync()}});
function pmove(id,s){const it=S.pack.items,i=it.findIndex(x=>x.id==id),j=it.findIndex((x,k)=>(s<0?k<i:k>i)&&x.list==it[i].list&&x.c==it[i].c&&(s<0?true:true));let t=-1;for(let k=i+s;k>=0&&k<it.length;k+=s)if(it[k].list==it[i].list&&it[k].c==it[i].c){t=k;break}if(t>=0){mv(it,i,t);save();plist()}}

document.addEventListener('input',ev=>{if(ev.target.id=='ts'){tq=ev.target.value;tlist()}if(ev.target.dataset.rk){S.fx=S.fx||{};const v=+ev.target.value;if(v>0){S.fx[ev.target.dataset.rk]=v;save()}}if(ev.target.closest('#cv'))cvt()});
addEventListener('scroll',()=>{if(!RM)document.documentElement.style.setProperty('--py',scrollY)},{passive:true});

const cv=$('#bg'),cx=cv.getContext('2d');let W,H,tm=0;const rz=()=>{W=cv.width=innerWidth;H=cv.height=innerHeight};rz();addEventListener('resize',rz);
function fr(){cx.clearRect(0,0,W,H);cx.globalCompositeOperation='lighter';for(let k=0;k<16;k++){cx.beginPath();cx.strokeStyle=`rgba(200,255,46,${.05+k*.012})`;cx.lineWidth=1+(k%3)*.6;for(let x=0;x<=W;x+=16){const u=x/W,y=H*.72-u*H*.45+Math.sin(u*5+tm+k*.22)*(40+k*9)*Math.sin(tm*.5+k*.1);x?cx.lineTo(x,y):cx.moveTo(x,y)}cx.stroke()}tm+=.012;if(!RM&&!document.hidden)requestAnimationFrame(fr)}fr();
const sp=$('#sp'),hide=()=>sp.classList.add('x');sp.onclick=hide;setTimeout(hide,RM?300:3000);
